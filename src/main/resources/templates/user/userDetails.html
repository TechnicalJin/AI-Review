<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>| User Details |</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!--<link rel="stylesheet" href="custom.css">-->

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --background-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            --card-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            --text-primary: #2c3e50;
            --text-secondary: #34495e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        h2 {
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 15px;
            text-align: center;
            font-size: 2.2rem;
        }

        h2:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), #2980b9);
            border-radius: 4px;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
        }

        .card-body {
            padding: 40px;
        }

        .card-title {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(52, 152, 219, 0.1);
        }

        .card-text {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(236, 240, 241, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .card-text:hover {
            background: rgba(236, 240, 241, 0.8);
            transform: translateX(5px);
        }

        .card-text i {
            margin-right: 15px;
            color: var(--primary-color);
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            margin-top: 25px;
            padding: 14px 30px;
            background: linear-gradient(45deg, var(--primary-color), #2980b9);
            color: white;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            border: none;
            cursor: pointer;
        }

        .nav-link:hover {
            background: linear-gradient(45deg, #2980b9, var(--primary-color));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
            color: white;
        }

        .nav-link i {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .nav-link h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .text-danger {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.1);
            text-align: center;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #e74c3c;
        }

        /* Enhanced Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 10px;
                margin: 10px;
            }

            h2 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }

            .card-body {
                padding: 20px;
            }

            .card-title {
                font-size: 1.3rem;
                margin-bottom: 20px;
            }

            .card-text {
                font-size: 1rem;
                padding: 12px;
                margin-bottom: 15px;
            }

            .card-text i {
                font-size: 1.1rem;
                margin-right: 12px;
            }

            .nav-link {
                padding: 12px 25px;
                width: 100%;
                justify-content: center;
            }

            .nav-link h3 {
                font-size: 1rem;
            }
        }

        /* Animation for card load */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeInUp 0.6s ease-out;
        }

        /* Hover effect for card text */
        .card-text span {
            transition: all 0.3s ease;
        }

        .card-text:hover span {
            color: var(--primary-color);
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>User Profile</h2>

    <div th:if="${user != null}">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Profile Information</h5>
                <p class="card-text">
                    <i class="fas fa-user"></i>
                    <span th:text="${user.username}"></span>
                </p>
                <p class="card-text">
                    <i class="fas fa-envelope"></i>
                    <span th:text="${user.email}"></span>
                </p>
                <p class="card-text">
                    <i class="fas fa-mobile-alt"></i>
                    <span th:text="${user.mobile}"></span>
                </p>
                <p class="card-text">
                    <i class="fas fa-user-tag"></i>
                    <span th:text="${user.role}"></span>
                </p>

                <a class="nav-link" th:href="@{/user/home}">
                    <i class="fas fa-arrow-left"></i>
                    <h3>Back to Home</h3>
                </a>
            </div>
        </div>
    </div>

    <div th:if="${user == null}">
        <p class="text-danger">
            <i class="fas fa-exclamation-circle"></i>
            User details not available
        </p>
    </div>
</div>

</body>
</html>
