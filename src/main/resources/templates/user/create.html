<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Client</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'slide-up': 'slideUp 0.5s ease-out',
            'tag-bounce': 'tagBounce 0.4s ease-out',
          },
          keyframes: {
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            tagBounce: {
              '0%': { transform: 'scale(0.8)', opacity: '0' },
              '50%': { transform: 'scale(1.05)' },
              '100%': { transform: 'scale(1)', opacity: '1' }
            }
          },
          colors: {
            'primary': '#4f46e5',
            'primary-hover': '#4338ca',
            'secondary': '#f3f4f6',
            'secondary-hover': '#e5e7eb',
            'accent': '#10b981',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #fafafa;
    }

    p {
      font-size: 1.1em;
      font-weight: 300;
      line-height: 1.7em;
      color: #999;
    }

    .container {
      max-width: 90%;
      margin: 20px auto;
      padding: 20px;
    }

    .container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .container img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px auto;
    }

    .rounded {
      border-radius: 10px;
    }

    .p-4 {
      padding: 20px;
    }

    .mb-3 {
      margin-bottom: 15px;
    }

    .col-form-label {
      font-weight: bold;
    }

    .custom-input {
      border: 1px solid #ced4da;
    }

    .text-danger {
      color: #dc3545;
      font-size: smaller;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
      max-width: 100%;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
    }

    #chatTextInput {
      width: 100%;
      padding: 8px 40px 8px 12px;
      border-radius: 20px;
      border: 2px solid #e5e7eb;
      font-size: 14px;
      transition: all 0.3s ease;
      color: #1f2937;
    }

    #chatTextInput:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      outline: none;
    }

    .plus-btn-inside {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      padding: 6px 12px;
      cursor: pointer;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .plus-btn-inside:hover {
      background-color: #4338ca;
      transform: translateY(-50%) scale(1.05);
    }

    .tag-modern {
      display: inline-flex;
      align-items: center;
      background-color: #D2E3FC;
      border: 1px solid #AECBFA;
      color: #202124;
      padding: 5px 12px;
      margin: 4px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .tag-modern:hover {
      background-color: #C0D8FC;
      transform: translateY(-1px);
    }

    .tag-modern:active {
      background-color: #AECBFA;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
    }

    .tag-modern .remove-tag-btn {
      margin-left: 8px;
      font-size: 16px;
      color: #5f6368;
      cursor: pointer;
      transition: color 0.2s;
    }

    .tag-modern .remove-tag-btn:hover {
      color: #D93025;
    }

    .selected-tags {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      .input-wrapper {
        flex-direction: column;
        max-width: 100%;
      }

      #chatTextInput {
        padding-right: 10px;
        border-radius: 5px;
      }

      .plus-btn-inside {
        position: static;
        transform: translateY(0);
        margin-top: 5px;
        border-radius: 5px;
      }

      .selected-tags {
        flex-direction: row;
      }

      .tag-modern {
        margin: 5px;
      }
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a href="/user/home" class="btn btn-secondary">
      <i class="fas fa-arrow-left"></i> Back
    </a>
  </div>
</nav>
<div class="container my-3">
  <div class="row">
    <div class="col-md-8 mx-auto rounded border p-4">
      <h2 class="text-center mb-5">New Client</h2>

      <div class="mb-4 p-3 bg-red-100 text-red-800 rounded-lg border border-red-300 hidden animate-slide-up" id="errorMessage" role="alert">
        <div class="flex items-center">
          <i class="fas fa-exclamation-triangle mr-2 text-base"></i>
          <span id="errorText" class="font-medium text-sm"></span>
        </div>
      </div>

      <form method="post" th:action="@{/user/create}" th:object="${clientDao}" enctype="multipart/form-data" id="clientForm">
        <input type="hidden" id="clientId" th:value="${clientId != null ? clientId : ''}" />

        <div class="row mb-3">
          <label for="nameInput" class="col-sm-4 col-form-label">Name</label>
          <div class="col-sm-8">
            <input class="form-control custom-input" th:field="*{name}" id="nameInput" required aria-describedby="nameError" />
            <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="*{name}" role="alert"></p>
            <p id="nameError" class="text-danger" role="alert"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label for="emailInput" class="col-sm-4 col-form-label">Email</label>
          <div class="col-sm-8">
            <input type="email" class="form-control custom-input" th:field="*{email}" id="emailInput" required aria-describedby="emailError" />
            <p th:if="${#fields.hasErrors('email')}" th:errorclass="text-danger" th:errors="*{email}" role="alert"></p>
            <p id="emailError" class="text-danger" role="alert"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label for="passwordInput" class="col-sm-4 col-form-label">Password</label>
          <div class="col-sm-8">
            <input type="password" class="form-control custom-input" th:field="*{password}" id="passwordInput" required minlength="6" aria-describedby="passwordError" />
            <p th:if="${#fields.hasErrors('password')}" th:errorclass="text-danger" th:errors="*{password}" role="alert"></p>
            <p id="passwordError" class="text-danger" role="alert"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label for="mobileInput" class="col-sm-4 col-form-label">Mobile</label>
          <div class="col-sm-8">
            <input type="text" class="form-control custom-input" th:field="*{mobile}" id="mobileInput" required maxlength="10" aria-describedby="mobileError" />
            <p th:if="${#fields.hasErrors('mobile')}" th:errorclass="text-danger" th:errors="*{mobile}" role="alert"></p>
            <p id="mobileError" class="text-danger" role="alert"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label for="reviewLinkInput" class="col-sm-4 col-form-label">Review Link</label>
          <div class="col-sm-8">
            <input type="text" class="form-control custom-input" th:field="*{reviewLink}" id="reviewLinkInput" required aria-describedby="reviewLinkError" />
            <p th:if="${#fields.hasErrors('reviewLink')}" th:errorclass="text-danger" th:errors="*{reviewLink}" role="alert"></p>
            <p id="reviewLinkError" class="text-danger" role="alert"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label for="logoInput" class="col-sm-4 col-form-label">Logo</label>
          <div class="col-sm-8">
            <input type="file" class="form-control custom-input" th:field="*{logo}" id="logoInput" accept="image/jpeg,image/png" required aria-describedby="logoError" />
            <p class="text-muted">Up to max 2 MB (JPEG or PNG)</p>
            <p id="logoError" class="text-danger" role="alert"></p>
          </div>
        </div>

        <input type="hidden" id="tagsInput" th:field="*{chatText}" />
        <div class="row mb-3">
          <label for="chatTextInput" class="col-sm-4 col-form-label">Chat Text</label>
          <div class="col-sm-8">
            <div class="input-wrapper">
              <input type="text" id="chatTextInput" class="form-control custom-input" placeholder="Enter tag (use commas for multiple)" aria-describedby="chatTextError" />
              <button type="button" class="plus-btn-inside bg-primary hover:bg-primary-hover" onclick="addTag()">+</button>
            </div>
            <div class="selected-tags mt-3">
              <h5>Selected Tags</h5>
            </div>
            <p th:if="${#fields.hasErrors('chatText')}" th:errorclass="text-danger" th:errors="*{chatText}" role="alert"></p>
            <p id="chatTextError" class="text-danger" role="alert"></p>
          </div>
        </div>

        <div class="row">
          <div class="offset-sm-4 col-sm-4 d-grid">
            <button type="button" class="btn bg-primary hover:bg-primary-hover text-white" onclick="submitForm()">Add</button>
          </div>
          <div class="col-sm-4 d-grid">
            <a href="/user/home" class="btn btn-secondary">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
  const tagSet = new Set();
  let errorTimeout;

  function validateForm() {
    let isValid = true;

    // Name validation
    const nameInput = document.getElementById('nameInput');
    const nameError = document.getElementById('nameError');
    if (!nameInput.value.trim()) {
      nameError.textContent = "Name is required.";
      nameInput.setAttribute('aria-invalid', 'true');
      isValid = false;
    } else {
      nameError.textContent = "";
      nameInput.removeAttribute('aria-invalid');
    }

    // Email validation
    const emailInput = document.getElementById('emailInput');
    const emailError = document.getElementById('emailError');
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailInput.value.trim() || !emailRegex.test(emailInput.value.trim())) {
      emailError.textContent = "Invalid email address.";
      emailInput.setAttribute('aria-invalid', 'true');
      isValid = false;
    } else {
      emailError.textContent = "";
      emailInput.removeAttribute('aria-invalid');
    }

    // Password validation
    const passwordInput = document.getElementById('passwordInput');
    const passwordError = document.getElementById('passwordError');
    if (!passwordInput.value.trim() || passwordInput.value.length < 6) {
      passwordError.textContent = "Password must be at least 6 characters.";
      passwordInput.setAttribute('aria-invalid', 'true');
      isValid = false;
    } else {
      passwordError.textContent = "";
      passwordInput.removeAttribute('aria-invalid');
    }

    // Mobile validation
    const mobileInput = document.getElementById('mobileInput');
    const mobileError = document.getElementById('mobileError');
    const mobileRegex = /^\d{10}$/;
    if (!mobileInput.value.trim() || !mobileRegex.test(mobileInput.value.trim())) {
      mobileError.textContent = "Enter a valid 10-digit mobile number.";
      mobileInput.setAttribute('aria-invalid', 'true');
      isValid = false;
    } else {
      mobileError.textContent = "";
      mobileInput.removeAttribute('aria-invalid');
    }

    // Review Link validation
    const reviewLinkInput = document.getElementById('reviewLinkInput');
    const reviewLinkError = document.getElementById('reviewLinkError');
    if (!reviewLinkInput.value.trim() || !isValidURL(reviewLinkInput.value)) {
      reviewLinkError.textContent = "Please enter a valid HTTP/HTTPS URL.";
      reviewLinkInput.setAttribute('aria-invalid', 'true');
      isValid = false;
    } else {
      reviewLinkError.textContent = "";
      reviewLinkInput.removeAttribute('aria-invalid');
    }

    // Logo validation
    const logoInput = document.getElementById('logoInput');
    const logoError = document.getElementById('logoError');
    if (logoInput.files.length === 0) {
      logoError.textContent = "Please upload a logo.";
      logoInput.setAttribute('aria-invalid', 'true');
      isValid = false;
    } else {
      logoError.textContent = "";
      logoInput.removeAttribute('aria-invalid');
    }

    // Tags validation
    if (tagSet.size < 10) {
      document.getElementById('chatTextError').textContent = "Please add at least 10 tags.";
      document.getElementById('chatTextInput').setAttribute('aria-invalid', 'true');
      isValid = false;
    } else {
      document.getElementById('chatTextError').textContent = "";
      document.getElementById('chatTextInput').removeAttribute('aria-invalid');
    }

    return isValid;
  }

  function addTag() {
    const input = document.getElementById("chatTextInput");
    const tagsInput = document.getElementById("tagsInput");
    const chatTextError = document.getElementById("chatTextError");
    let inputValue = input.value.trim();

    if (inputValue) {
      let tags = inputValue.split(',')
        .map(tag => tag.trim())
        .filter(tag => tag !== '');

      let added = false;
      for (let tag of tags) {
        if (!tagSet.has(tag)) {
          tagSet.add(tag);
          added = true;
        } else {
          showError(`Tag "${tag}" already exists!`);
        }
      }

      if (added) {
        tagsInput.value = Array.from(tagSet).join(", ");
        updateDisplayedTags();
        chatTextError.textContent = "";
        input.removeAttribute('aria-invalid');
      }
      input.value = "";
    } else {
      showError("Please enter a tag.");
      input.setAttribute('aria-invalid', 'true');
    }
  }

  function updateDisplayedTags() {
    const container = document.querySelector('.selected-tags');
    container.innerHTML = "<h5>Selected Tags</h5>";

    tagSet.forEach((tag, index) => {
      const tagElement = document.createElement('span');
      tagElement.className = 'tag-modern';
      tagElement.style.animationDelay = `${index * 0.05}s`;

      const tagText = document.createElement('span');
      tagText.className = 'mr-1.5';
      tagText.innerHTML = escapeHtml(tag);
      tagElement.appendChild(tagText);

      const removeIcon = document.createElement('button');
      removeIcon.type = 'button';
      removeIcon.className = 'remove-tag-btn w-5 h-5 flex items-center justify-center rounded-full text-xs';
      removeIcon.innerHTML = '<i class="fas fa-times"></i>';
      removeIcon.setAttribute('aria-label', `Remove tag ${tag}`);
      removeIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        removeTag(tag);
      });

      tagElement.appendChild(removeIcon);
      container.appendChild(tagElement);
    });
  }

  function removeTag(tag) {
    tagSet.delete(tag);
    document.getElementById("tagsInput").value = Array.from(tagSet).join(", ");
    updateDisplayedTags();

    if (tagSet.size < 10) {
      document.getElementById('chatTextError').textContent = "Please add at least 10 tags.";
      document.getElementById('chatTextInput').setAttribute('aria-invalid', 'true');
    } else {
      document.getElementById('chatTextError').textContent = "";
      document.getElementById('chatTextInput').removeAttribute('aria-invalid');
    }
  }

  function isValidURL(string) {
    try {
      const url = new URL(string);
      return url.protocol === 'http:' || url.protocol === 'https:';
    } catch (_) {
      return false;
    }
  }

  function showError(message) {
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    clearTimeout(errorTimeout);
    errorText.textContent = message;
    errorMessage.classList.remove('hidden');
    errorTimeout = setTimeout(() => errorMessage.classList.add('hidden'), 5000);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function resetForm() {
    tagSet.clear();
    updateDisplayedTags();
    document.getElementById('clientForm').reset();
  }

  function submitForm() {
    if (validateForm()) {
      const form = document.getElementById("clientForm");
      const formData = new FormData(form);
      fetch(form.action, {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (response.ok) {
          resetForm();
          window.location.href = '/user/home';
        } else {
          showError('Failed to create client. Please try again.');
        }
      })
      .catch(() => showError('An error occurred. Please try again.'));
    }
  }

  // Logo input validation
  const logoInput = document.getElementById('logoInput');
  const logoError = document.getElementById('logoError');
  logoInput.addEventListener('change', function() {
    const file = this.files[0];
    if (file) {
      const maxSize = 2 * 1024 * 1024; // 2 MB
      if (file.size > maxSize) {
        logoError.textContent = "File size exceeds 2 MB.";
        logoInput.value = '';
        logoInput.setAttribute('aria-invalid', 'true');
      } else if (!['image/jpeg', 'image/png'].includes(file.type)) {
        logoError.textContent = "Only JPEG or PNG files are allowed.";
        logoInput.value = '';
        logoInput.setAttribute('aria-invalid', 'true');
      } else {
        logoError.textContent = "";
        logoInput.removeAttribute('aria-invalid');
      }
    }
  });
</script>
</body>
</html>
