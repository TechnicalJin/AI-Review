<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>| Create Client |</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"/>
  <link rel="stylesheet" href="custom.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    /* Add missing styles */
    .input-wrapper {
        position: relative;
        max-width: 300px;
        display: flex;
        align-items: center;
    }

    .selected-tags {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
    }

    .tag {
        display: inline-flex;
        align-items: center;
        background-color: #D2E3FC;
        border: 1px solid #AECBFA;
        color: #202124;
        padding: 5px 12px;
        margin: 4px;
        border-radius: 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
    }

    .plus-btn-inside {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
    }
  </style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a href="/user/home" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>
</nav>
<div class="container my-3">
  <div class="row">
    <div class="col-md-8 mx-auto rounded border p-4">
      <h2 class="text-center mb-5">New Client</h2>

      <form method="post" th:object="${clientDao}" enctype="multipart/form-data" id="clientForm" onsubmit="return validateForm()">

        <input type="hidden" id="clientId" th:value="${clientId}" />

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Name</label>
          <div class="col-sm-8">
            <input class="form-control" th:field="*{name}" required />
            <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="*{name}"></p>
            <p id="nameError" class="text-danger"></p> </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Email</label>
          <div class="col-sm-8">
            <input type="email" class="form-control" th:field="*{email}" required />
            <p th:if="${#fields.hasErrors('email')}" th:errorclass="text-danger" th:errors="*{email}"></p>
            <p id="emailError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Password</label>
          <div class="col-sm-8">
            <input type="password" class="form-control" th:field="*{password}" required minlength="6" />
            <p th:if="${#fields.hasErrors('password')}" th:errorclass="text-danger" th:errors="*{password}"></p>
            <p id="passwordError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Mobile</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" th:field="*{mobile}" id="mobile" required maxlength="10" />
            <p th:if="${#fields.hasErrors('mobile')}" th:errorclass="text-danger" th:errors="*{mobile}"></p>
            <p id="mobileError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Review Link</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" th:field="*{reviewLink}" required />
            <p th:if="${#fields.hasErrors('reviewLink')}" th:errorclass="text-danger" th:errors="*{reviewLink}"></p>
            <p id="reviewLinkError" class="text-danger"></p>
          </div>
        </div>

        <!--<div class="row mb-3">
          <label class="col-sm-4 col-form-label">Review Character Limit</label>
          <div class="col-sm-8">
            <input type="number" class="form-control" th:field="*{reviewCharLimit}" min="10" max="1000" required />
            <p th:if="${#fields.hasErrors('reviewCharLimit')}" th:errorclass="text-danger" th:errors="*{reviewCharLimit}"></p>
            <p id="reviewCharLimitError" class="text-danger"></p> &lt;!&ndash; Error will be displayed here &ndash;&gt;
          </div>
        </div>-->

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Logo</label>
          <div class="col-sm-8">
            <input type="file" class="form-control" th:field="*{logo}" accept="image/jpeg, image/png" placeholder="Up To Max 2 MB" required />
            <p id="logoError" class="text-danger"></p>
          </div>
        </div>

        <input type="hidden" id="tagsInput" th:field="*{chatText}" />
        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Chat Text</label>
          <div class="col-sm-8">
            <div class="input-wrapper">
              <input type="text" id="chatTextInput" class="form-control" placeholder="Enter tag" />
              <button type="button" class="plus-btn-inside btn btn-primary" onclick="addTag()">+</button>
            </div>
            <div class="selected-tags mt-3">
              <h5>Selected Tags</h5>
            </div>
            <p id="chatTextError" class="text-danger"></p>
          </div>
        </div>


        <!--<div class="row mb-3">
          <label class="col-sm-4 col-form-label">Generate Link</label>
          <div class="col-sm-8">
            <div class="input-group">
              <input type="text" id="generateLink" class="form-control" readonly />
              <button type="button" class="btn btn-primary" onclick="generateClientLink()">Generate</button>
              <button type="button" class="btn btn-secondary" onclick="copyToClipboard()">Copy</button>
            </div>
          </div>
        </div>-->

        <div class="row">
          <div class="offset-sm-4 col-sm-4 d-grid">
            <button type="button" class="btn btn-primary" onclick="submitForm()">ADD</button>
          </div>
          <div class="col-sm-4 d-grid">
            <a href="/user/home" class="btn btn-secondary">Cancel</a>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="scripts.js"></script>
<script>
const tagSet = new Set();

function validateForm() {
    let isValid = true;

    // Email validation
    const emailInput = document.querySelector('input[type="email"]');
    const emailError = document.getElementById('emailError');
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailRegex.test(emailInput.value.trim())) {
        emailError.textContent = "Invalid email address.";
        isValid = false;
    } else {
        emailError.textContent = "";
    }

    // Mobile validation
    const mobileInput = document.getElementById('mobile');
    const mobileError = document.getElementById('mobileError');
    const mobileRegex = /^\d{10}$/;

    if (!mobileRegex.test(mobileInput.value.trim())) {
        mobileError.textContent = "Enter a valid 10-digit mobile number.";
        isValid = false;
    } else {
        mobileError.textContent = "";
    }

    // Review Link validation
    const reviewLink = document.querySelector('input[name="reviewLink"]').value;
    const reviewLinkError = document.getElementById('reviewLinkError');

    if (!isValidURL(reviewLink)) {
        reviewLinkError.textContent = "Please enter a valid URL.";
        isValid = false;
    } else {
        reviewLinkError.textContent = "";
    }

    // Tags validation
    if (tagSet.size < 10) {
        document.getElementById('chatTextError').textContent = "Please add at least 10 tags.";
        isValid = false;
    } else {
        document.getElementById('chatTextError').textContent = "";
    }

    return isValid;
}

function addTag() {
    const input = document.getElementById("chatTextInput");
    const tagsInput = document.getElementById("tagsInput");
    let tagValue = input.value.trim();

    if (tagValue && !tagSet.has(tagValue)) {
        tagSet.add(tagValue);
        tagsInput.value = Array.from(tagSet).join(", ");
        input.value = "";
        updateDisplayedTags();
    }
}

function updateDisplayedTags() {
    const container = document.querySelector('.selected-tags');
    container.innerHTML = "<h5>Selected Tags</h5>";

    tagSet.forEach(tag => {
        const tagElement = document.createElement('span');
        tagElement.className = 'tag';
        tagElement.innerHTML = `${tag} <span onclick="removeTag('${tag}')">&times;</span>`;
        container.appendChild(tagElement);
    });
}

function removeTag(tag) {
    tagSet.delete(tag);
    document.getElementById("tagsInput").value = Array.from(tagSet).join(", ");
    updateDisplayedTags();
}

function isValidURL(string) {
    try {
        new URL(string);
        return true;
    } catch (_) {
        return false;
    }
}

function submitForm() {
    if (validateForm()) {
        document.getElementById("clientForm").submit();
    }
}
</script>
</body>
</html>
