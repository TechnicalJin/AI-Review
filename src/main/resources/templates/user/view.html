<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>| Client Details |</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/view.css}">
</head>
<body>
<div class="container">

    <div th:if="${clients != null and clients.size() > 0}">
        <div th:each="client : ${clients}" class="client-info" th:data-review-link="${client.reviewLink}">
            <h2 class="client-name" th:text="${client.name}"></h2>

            <hr/>

            <!-- Modified tag selection section -->
            <div class="tag-selection mb-3">
                <div class="tags-container" th:if="${client.chatText != null}">
                    <div th:each="tag, tagStat : ${#strings.arraySplit(client.chatText, ',')}"
                         class="tag-item form-check form-check-inline">
                        <input class="form-check-input tag-checkbox"
                               type="checkbox"
                               th:value="${#strings.trim(tag)}"
                               th:id="${'tag-' + tagStat.index}"
                               th:checked="${usedTags != null and usedTags.contains(#strings.trim(tag))}">
                        <label class="form-check-label"
                               th:for="${'tag-' + tagStat.index}"
                               th:text="${#strings.trim(tag)}"></label>
                    </div>
                </div>
                <div class="alert alert-warning mt-2 d-none" id="tag-warning">
                    <span>Please select at least 3 tags to regenerate the review.</span>
                </div>
            </div>

            <div th:if="${review != null}">
                <div class="btn-container mt-2">
                    <div class="review-length-controls">
                        <div class="btn-group" role="group" aria-label="Review length options">
                            <button type="button" class="btn btn-outline-secondary length-btn" data-length="short">Short</button>
                            <button type="button" class="btn btn-outline-secondary length-btn" data-length="medium">Medium</button>
                            <button type="button" class="btn btn-outline-secondary length-btn" data-length="large">Large</button>
                        </div>
                        <button class="btn btn-secondary regenerate-btn mt-2"
                                th:attr="data-client-id=${client.id}">Regenerate Review</button>
                    </div>
                </div><br>
                <h3>Generated Review:</h3>
                <div class="row mt-3">
                    <div class="col-12">
                        <textarea class="generated-msg-box" id="review-msg-content" th:text="${review}" readonly></textarea>
                    </div>
                </div>
                <div class="btn-container mt-2">
                    <button class="btn btn-primary" id="copy-btn">Copy Review</button>
                </div>
            </div>

            <div th:unless="${review != null}">
                <p>No review generated yet.</p>
            </div>
        </div>
    </div>

    <div th:if="${clients == null or clients.size() == 0}">
        <p>No clients found with that name.</p>
    </div>
</div>

<div class="footer">
    <a href="https://wa.me/918200010737?text=Hello,%0AI%20need%20the%20AI%20Review%20Card"
       target="_blank"
       class="cta-link">
        <i class="fab fa-whatsapp"></i>
        <span>Unlock New Possibilities: Get Your Digital Review Card Now!</span>
    </a>
    <p>
        <a href="https://yrhpsoftware.in/" target="_blank" class="website-link">
            <i class="fas fa-globe"></i>
            Developed by YRHP
        </a>
    </p>
    <p>&copy; 2025 YRHP | All Rights Reserved</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/view.js}"></script>

</body>
</html>
