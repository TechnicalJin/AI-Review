<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>| Review Generator |</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<!--    <link rel="stylesheet" href="s1.css">-->
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div class="wrapper">
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>YRHP</h3>
        </div>
        <ul class="list-unstyled components">
            <li>
                <a href="/user/create">
                    <i class="fas fa-user-plus"></i> Add Client
                </a>
            </li>
        </ul>
        <ul class="list-unstyled CTAs">
            <li>
                <a th:if="${user != null}" th:href="@{/user/details}" class="profile-link">
                    <i class="fas fa-user"></i> Profile
                </a>
            </li>
            <li>
                <a href="/logout" class="logout-link">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </li>
            <li>
                <a th:href="@{/user/log}" class="log-history-link">
                    <i class="fas fa-history"></i> Log History
                </a>
            </li>
        </ul>
    </nav>
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="fas fa-align-left"></i> <span>Menu</span>
                </button>
            </div>
        </nav>

        <div class="container my-3">
            <h2>Client List</h2>

            <div class="search-container">
                <form action="/user/search" method="get" class="d-flex">
                    <input type="text" 
                           name="query" 
                           class="form-control" 
                           placeholder="Search by name, mobile or email..." 
                           th:value="${searchQuery != null ? searchQuery : ''}"
                           aria-label="Search by name, mobile or email"/>
                    <button type="submit" class="search-btn">
                        <i class="fas fa-search"></i>
                        <span>Search</span>
                    </button>
                </form>
            </div>

            <!-- Updated search results message -->
            <div th:if="${searchQuery != null}" class="search-results">
                <div>
                    <span th:if="${clients.totalElements > 0}">
                        Found <strong th:text="${clients.totalElements}"></strong> results for "<strong th:text="${searchQuery}"></strong>"
                    </span>
                    <span th:unless="${clients.totalElements > 0}">
                        No results found for "<strong th:text="${searchQuery}"></strong>"
                    </span>
                </div>
                <a href="/user/home" class="clear-search">
                    <i class="fas fa-times"></i> Clear Search
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Logo</th>
                        <th>Chat Text</th>
                        <th>Review Link</th>
                        <!--<th>Generated Link</th>-->
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="client : ${clients.content}">
                        <td th:text="${client.id}"></td>
                        <td th:text="${client.name}" class="wrap-text"></td>
                        <td th:text="${client.email}" class="wrap-text"></td>
                        <td th:text="${client.mobile}"></td>
                        <td>
                            <img th:src="@{${resourceURL != null ? resourceURL : ''} + ${client.logo}}" 
                                 alt="Client Logo" 
                                 width="50"
                                 onerror="this.src='/default-logo.png'">
                        </td>
                        <td th:text="${client.chatText}" class="wrap-text"></td>
                        <td>
                            <a th:href="${client.reviewLink}" target="_blank" th:text="${client.reviewLink}" class="wrap-text"></a>
                        </td>
                        <!--<td>
                            <a th:href="${client.generateLink}" class="btn btn-success btn-sm" target="_blank">Go</a>
                        </td>-->

                        <td class="action-buttons">
                            <a th:href="${client.generateLink}" class="btn btn-success btn-sm" target="_blank" title="View">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a class="btn btn-primary btn-sm" th:href="@{/user/edit/{id}(id=${client.id})}" title="Edit">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a class="btn btn-danger btn-sm" th:href="@{/user/delete/{id}(id=${client.id})}" onclick="return confirm('Are you sure?')" title="Delete">
                                <i class="fas fa-trash-alt"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Enhanced Pagination Controls -->
            <div class="pagination-wrapper" th:if="${clients.totalElements > 0}">
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <!-- Previous Button -->
                        <li class="page-item" th:classappend="${clients.first ? 'disabled' : ''}">
                            <a class="page-link" 
                               th:href="@{${searchQuery != null ? '/user/search' : '/user/home'}(page=0, size=${clients.size}, query=${searchQuery})}" 
                               th:if="${!clients.first}">
                                First
                            </a>
                            <span class="page-link" th:if="${clients.first}">First</span>
                        </li>
                        
                        <li class="page-item" th:classappend="${clients.first ? 'disabled' : ''}">
                            <a class="page-link" 
                               th:href="@{${searchQuery != null ? '/user/search' : '/user/home'}(page=${clients.number - 1}, size=${clients.size}, query=${searchQuery})}"
                               th:if="${!clients.first}">
                                Previous
                            </a>
                            <span class="page-link" th:if="${clients.first}">Previous</span>
                        </li>

                        <!-- Page Numbers -->
                        <li class="page-item" 
                            th:each="pageNumber : ${#numbers.sequence(0, clients.totalPages - 1)}"
                            th:classappend="${pageNumber == clients.number ? 'active' : ''}"
                            th:if="${pageNumber >= clients.number - 2 and pageNumber <= clients.number + 2}">
                            <a class="page-link" 
                               th:href="@{${searchQuery != null ? '/user/search' : '/user/home'}(page=${pageNumber}, size=${clients.size}, query=${searchQuery})}"
                               th:text="${pageNumber + 1}">1</a>
                        </li>

                        <!-- Next Button -->
                        <li class="page-item" th:classappend="${clients.last ? 'disabled' : ''}">
                            <a class="page-link" 
                               th:href="@{${searchQuery != null ? '/user/search' : '/user/home'}(page=${clients.number + 1}, size=${clients.size}, query=${searchQuery})}"
                               th:if="${!clients.last}">
                                Next
                            </a>
                            <span class="page-link" th:if="${clients.last}">Next</span>
                        </li>
                        
                        <li class="page-item" th:classappend="${clients.last ? 'disabled' : ''}">
                            <a class="page-link" 
                               th:href="@{${searchQuery != null ? '/user/search' : '/user/home'}(page=${clients.totalPages - 1}, size=${clients.size}, query=${searchQuery})}"
                               th:if="${!clients.last}">
                                Last
                            </a>
                            <span class="page-link" th:if="${clients.last}">Last</span>
                        </li>
                    </ul>
                </nav>
                <!-- Pagination Info -->
                <div class="pagination-info text-center mt-2">
                    Showing <span th:text="${clients.numberOfElements}"></span> of 
                    <span th:text="${clients.totalElements}"></span> items
                    (Page <span th:text="${clients.number + 1}"></span> of 
                    <span th:text="${clients.totalPages}"></span>)
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Simplify JavaScript imports -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function () {
        $('#sidebarCollapse').on('click', function () {
            $('#sidebar').toggleClass('active');
            $('#content').toggleClass('active');
            $('body').toggleClass('sidebar-active');
        });

        // Close sidebar when clicking outside on mobile only
        $('body').on('click', function(e) {
            if (window.innerWidth <= 768 && 
                $('body').hasClass('sidebar-active') && 
                !$(e.target).closest('#sidebar').length && 
                !$(e.target).closest('#sidebarCollapse').length) {
                $('#sidebar').removeClass('active');
                $('#content').removeClass('active');
                $('body').removeClass('sidebar-active');
            }
        });
    });
</script>
</body>
</html>
