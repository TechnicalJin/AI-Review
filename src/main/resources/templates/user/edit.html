<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>| Edit Client |</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>

  <style>
    /* custom.css */

    @import url("https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700");

    body {
       font-family: 'Poppins', sans-serif;
       background: #fafafa;
    }

    p {
       font-size: 1.1em;
       font-weight: 300;
       line-height: 1.7em;
       color: #999;
    }

    .container {
       max-width: 960px;
       margin: 20px auto;
       padding: 20px;
    }

    .container h2 {
       text-align: center;
       margin-bottom: 20px;
    }

    .container p {
       margin-bottom: 10px;
    }

    .container img {
       max-width: 100%;
       height: auto;
       display: block;
       margin: 10px auto;
    }

    /* Form Styles (Edit Client) */
    .rounded {
       border-radius: 10px;
    }

    .p-4 {
       padding: 20px;
    }

    .mb-3 {
       margin-bottom: 15px;
    }

    .col-form-label {
       font-weight: bold;
    }

    .form-control {
       border: 1px solid #ced4da;
    }

    .text-danger {
       color: #dc3545;
       font-size: smaller;
    }

    .input-wrapper {
       position: relative;
       width: 100%;
       max-width: 100%;
       margin-bottom: 10px;
    }

    #chatTextInput {
       width: 100%;
       padding: 8px 40px 8px 12px;
       border-radius: 20px;
       border: 1px solid #c1dafc;
       font-size: 14px;
    }

    .plus-btn-inside {
       position: absolute;
       right: 10px;
       top: 50%;
       transform: translateY(-50%);
       padding: 6px 12px;
       cursor: pointer;
       background-color: #007bff;
       color: white;
       border: none;
       border-radius: 50%;
       font-size: 18px;
       transition: background-color 0.3s ease;
    }

    .plus-btn-inside:hover {
       background-color: #0056b3;
    }

    /* Tag styling */
    .tag {
        display: inline-flex;
        align-items: center;
        background-color: #D2E3FC;
        border: 1px solid #AECBFA;
        color: #202124;
        padding: 5px 12px;
        margin: 4px;
        border-radius: 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s, box-shadow 0.2s;
    }

    .tag:hover {
        background-color: #C0D8FC;
    }

    .tag:active {
        background-color: #AECBFA;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
    }

    .close-icon {
        margin-left: 8px;
        font-size: 16px;
        color: #5f6368;
        cursor: pointer;
        transition: color 0.2s;
    }

    .close-icon:hover {
        color: #D93025;
    }

    .selected-tags {
       margin-top: 20px;
       display: flex;
       flex-wrap: wrap;
    }

    /* Responsive Styles */
    @media (max-width: 768px) {
       .container {
           padding: 10px;
       }

       .row {
           flex-direction: column;
       }

       .col-md-8, .col-sm-8, .offset-sm-4, .col-sm-4 {
           width: 100%;
       }

       .input-wrapper {
           flex-direction: column;
           max-width: 100%;
       }

       #chatTextInput {
           padding-right: 10px;
           border-radius: 5px;
       }

       .plus-btn-inside {
           position: static;
           transform: translateY(0);
           margin-top: 5px;
           border-radius: 5px;
       }

       .selected-tags {
           flex-direction: row;
       }

       .tag {
           margin: 5px;
       }
    }
  </style>

</head>
<body>
<div class="container my-3">
  <div class="row">
    <div class="col-md-8 mx-auto rounded border p-4">
      <h2 class="text-center mb-5">Edit Client</h2>
      <form method="post" th:action="@{/user/edit/{id}(id=${clientId})}" th:object="${clientDao}" id="editForm" enctype="multipart/form-data" onsubmit="return validateForm()">
        <input type="hidden" id="clientId" th:value="${clientId}">

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Name</label>
          <div class="col-sm-8">
            <input class="form-control" th:field="*{name}" required />
            <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="*{name}"></p>
            <p id="nameError" class="text-danger"></p> </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Email</label>
          <div class="col-sm-8">
            <input type="email" class="form-control" th:field="*{email}" />
            <p id="emailError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Password</label>
          <div class="col-sm-8">
            <input type="password" class="form-control" th:field="*{password}" minlength="6" />
            <p th:if="${#fields.hasErrors('password')}" th:errorclass="text-danger" th:errors="*{password}"></p>
            <p id="passwordError" class="text-danger"></p>
            <small class="text-muted">Leave blank to keep current password</small>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Mobile</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" th:field="*{mobile}" id="mobile" required maxlength="10"/>
            <p id="mobileError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Review Link</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" th:field="*{reviewLink}" required id="reviewLink"/>
            <p th:if="${#fields.hasErrors('reviewLink')}" th:errorclass="text-danger" th:errors="*{reviewLink}"></p>
            <p id="reviewLinkError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Logo</label>
          <div class="col-sm-8">
            <div id="logoPreview">
              <img th:if="${clientDao.existingLogo}" th:src="@{'/uploads/' + ${clientDao.existingLogo}}" alt="Current Logo" width="100">
            </div>
            <input type="file" class="form-control" id="logoInput" th:field="*{logo}" accept="image/jpeg, image/png"/>
            <input type="hidden" th:field="*{existingLogo}"/>
            <p id="logoError" class="text-danger"></p>
          </div>
        </div>

        <input type="hidden" id="tagsInput" th:field="*{chatText}" />
        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Chat Text</label>
          <div class="col-sm-8">
            <div class="input-wrapper">
              <input type="text" id="chatTextInput" class="form-control" placeholder="Enter tag (use commas for multiple)" />
              <button type="button" class="plus-btn-inside" onclick="addTag()">+</button>
            </div>
            <div class="selected-tags mt-3">
              <h5>Selected Tags</h5>
            </div>
            <p id="chatTextError" class="text-danger"></p>
          </div>
        </div>

        <div class="row">
          <div class="offset-sm-4 col-sm-4 d-grid">
            <button type="button" class="btn btn-primary" onclick="submitForm()">Update</button>
          </div>
          <div class="col-sm-4 d-grid">
            <a href="/user/home" class="btn btn-secondary">Cancel</a>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const tagSet = new Set();

  function validateForm() {
    let isValid = true;

    // Email validation
    const emailInput = document.querySelector('input[type="email"]');
    const emailError = document.getElementById('emailError');
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailRegex.test(emailInput.value.trim())) {
        emailError.textContent = "Invalid email address.";
        isValid = false;
    } else {
        emailError.textContent = "";
    }

    // Mobile validation
    const mobileInput = document.getElementById('mobile');
    const mobileError = document.getElementById('mobileError');
    const mobileRegex = /^\d{10}$/;

    if (!mobileRegex.test(mobileInput.value.trim())) {
        mobileError.textContent = "Enter a valid 10-digit mobile number.";
        isValid = false;
    } else {
        mobileError.textContent = "";
    }

    // Review Link
    let reviewLink = document.getElementById("reviewLink").value;
    if (reviewLink.trim() === "") {
        document.getElementById("reviewLinkError").textContent = "Review Link is required.";
        isValid = false;
    } else if (!isValidURL(reviewLink)) {
        document.getElementById("reviewLinkError").textContent = "Invalid Review Link format.";
        isValid = false;
    } else {
        document.getElementById("reviewLinkError").textContent = "";
    }

    // Logo validation
    const logoInput = document.getElementById('logoInput');
    const logoError = document.getElementById('logoError');
    const existingLogo = document.querySelector("#logoPreview img");

    if (logoInput.files.length === 0 && !existingLogo) {
        logoError.textContent = "Please upload a logo.";
        isValid = false;
    } else {
        logoError.textContent = "";
    }

    // Tags validation
    if (tagSet.size < 10) {
        document.getElementById('chatTextError').textContent = "You must add at least 10 tags.";
        isValid = false;
    } else {
        document.getElementById('chatTextError').textContent = "";
    }

    return isValid;
  }

  function addTag() {
      const input = document.getElementById("chatTextInput");
      const tagsInput = document.getElementById("tagsInput");
      const chatTextError = document.getElementById("chatTextError");

      let inputValue = input.value.trim();
      if (inputValue) {
          // Split by commas and process each tag
          let tags = inputValue.split(',')
              .map(tag => tag.trim())
              .filter(tag => tag !== '');

          let added = false;
          for (let tag of tags) {
              if (!tagSet.has(tag)) {
                  tagSet.add(tag);
                  added = true;
              }
          }

          if (added) {
              tagsInput.value = Array.from(tagSet).join(", ");
              updateDisplayedTags();
              chatTextError.textContent = "";
          }
          input.value = "";
      }
  }

  function updateDisplayedTags() {
      const selectedTagsDiv = document.querySelector('.selected-tags');
      selectedTagsDiv.innerHTML = "<h5>Selected Tags</h5>";

      tagSet.forEach(tag => {
          let tagSpan = document.createElement('span');
          tagSpan.classList.add('tag');
          tagSpan.textContent = tag;

          let closeIcon = document.createElement('span');
          closeIcon.classList.add('close-icon');
          closeIcon.innerHTML = "&times;";
          closeIcon.onclick = function () {
              removeTag(tag);
          };

          tagSpan.appendChild(closeIcon);
          selectedTagsDiv.appendChild(tagSpan);
      });
  }

  function removeTag(tagToRemove) {
      tagSet.delete(tagToRemove);
      document.getElementById("tagsInput").value = Array.from(tagSet).join(", ");
      updateDisplayedTags();

      // Update validation message
      if (tagSet.size < 10) {
          document.getElementById('chatTextError').textContent = "You must add at least 10 tags.";
      } else {
          document.getElementById('chatTextError').textContent = "";
      }
  }

  function initializeTags(existingTags) {
      existingTags.split(',').forEach(tag => {
          let trimmedTag = tag.trim();
          if (trimmedTag) {
              tagSet.add(trimmedTag);
          }
      });
      updateDisplayedTags();
  }

  function isValidURL(string) {
      try {
          new URL(string);
          return true;
      } catch (_) {
          return false;
      }
  }

  function submitForm() {
      if (validateForm()) {
          document.getElementById("editForm").submit();
      }
  }

  // Initialize tags on page load
  window.addEventListener('DOMContentLoaded', () => {
      const tagsInput = document.getElementById("tagsInput");
      if (tagsInput.value.trim()) {
          initializeTags(tagsInput.value);
      }
  });
</script>
</body>
</html>
