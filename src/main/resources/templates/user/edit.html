<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Client</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'fade-in': 'fadeIn 0.6s ease-out',
            'slide-up': 'slideUp 0.5s ease-out',
            'tag-bounce': 'tagBounce 0.4s ease-out',
            'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
            'slide-in-left': 'slideInLeft 0.5s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            slideInLeft: {
              '0%': { opacity: '0', transform: 'translateX(-20px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' }
            },
            tagBounce: {
              '0%': { transform: 'scale(0.8)', opacity: '0' },
              '50%': { transform: 'scale(1.05)' },
              '100%': { transform: 'scale(1)', opacity: '1' }
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.7' }
            }
          },
          colors: {
            'primary': '#4f46e5',
            'primary-hover': '#4338ca',
            'secondary': '#f3f4f6',
            'secondary-hover': '#e5e7eb',
            'accent': '#10b981',
          }
        }
      }
    }
  </script>
  <style>
    @import url("https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700");

    body {
      font-family: 'Poppins', sans-serif;
      background: #fafafa;
    }

    p {
      font-size: 1.1em;
      font-weight: 300;
      line-height: 1.7em;
      color: #999;
    }

    .container {
      max-width: 960px;
      margin: 20px auto;
      padding: 20px;
    }

    .container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .container img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px auto;
    }

    .rounded {
      border-radius: 10px;
    }

    .p-4 {
      padding: 20px;
    }

    .mb-3 {
      margin-bottom: 15px;
    }

    .col-form-label {
      font-weight: bold;
    }

    .form-control {
      border: 1px solid #ced4da;
    }

    .text-danger {
      color: #dc3545;
      font-size: smaller;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
      max-width: 100%;
      margin-bottom: 10px;
    }

    #chatTextInput {
      width: 100%;
      padding: 8px 40px 8px 12px;
      border-radius: 20px;
      border: 2px solid #e5e7eb;
      font-size: 14px;
      transition: all 0.3s ease;
      color: #1f2937;
    }

    #chatTextInput:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      outline: none;
    }

    .plus-btn-inside {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      padding: 6px 12px;
      cursor: pointer;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .plus-btn-inside:hover {
      background-color: #4338ca;
      transform: translateY(-50%) scale(1.05);
    }

    .tag-modern {
      display: inline-flex;
      align-items: center;
      background-color: #D2E3FC;
      border: 1px solid #AECBFA;
      color: #202124;
      padding: 5px 12px;
      margin: 4px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .tag-modern:hover {
      background-color: #C0D8FC;
      transform: translateY(-1px);
    }

    .tag-modern:active {
      background-color: #AECBFA;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
    }

    .tag-modern .remove-tag-btn {
      margin-left: 8px;
      font-size: 16px;
      color: #5f6368;
      cursor: pointer;
      transition: color 0.2s;
    }

    .tag-modern .remove-tag-btn:hover {
      color: #D93025;
    }

    .selected-tags {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      .row {
        flex-direction: column;
      }

      .col-md-8, .col-sm-8, .offset-sm-4, .col-sm-4 {
        width: 100%;
      }

      .input-wrapper {
        flex-direction: column;
        max-width: 100%;
      }

      #chatTextInput {
        padding-right: 10px;
        border-radius: 5px;
      }

      .plus-btn-inside {
        position: static;
        transform: translateY(0);
        margin-top: 5px;
        border-radius: 5px;
      }

      .selected-tags {
        flex-direction: row;
      }

      .tag-modern {
        margin: 5px;
      }
    }
  </style>
</head>
<body>
<div class="container my-3">
  <div class="row">
    <div class="col-md-8 mx-auto rounded border p-4">
      <h2 class="text-center mb-5">Edit Client</h2>

      <div class="mb-4 p-3 bg-red-100 text-red-800 rounded-lg border border-red-300 hidden animate-slide-up" id="errorMessage">
        <div class="flex items-center">
          <i class="fas fa-exclamation-triangle mr-2 text-base"></i>
          <span id="errorText" class="font-medium text-sm"></span>
        </div>
      </div>

      <form method="post" th:action="@{/user/edit/{id}(id=${clientId})}" th:object="${clientDao}" id="editForm" enctype="multipart/form-data" onsubmit="return validateForm()">
        <input type="hidden" id="clientId" th:value="${clientId}">

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Name</label>
          <div class="col-sm-8">
            <input class="form-control" th:field="*{name}" required />
            <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="*{name}"></p>
            <p id="nameError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Email</label>
          <div class="col-sm-8">
            <input type="email" class="form-control" th:field="*{email}" />
            <p id="emailError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Password</label>
          <div class="col-sm-8">
            <input type="password" class="form-control" th:field="*{password}" />
            <p th:if="${#fields.hasErrors('password')}" th:errorclass="text-danger" th:errors="*{password}"></p>
            <p id="passwordError" class="text-danger"></p>
            <small class="text-muted">Leave blank to keep current password</small>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Mobile</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" th:field="*{mobile}" id="mobile" required maxlength="10"/>
            <p id="mobileError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Review Link</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" th:field="*{reviewLink}" required id="reviewLink"/>
            <p th:if="${#fields.hasErrors('reviewLink')}" th:errorclass="text-danger" th:errors="*{reviewLink}"></p>
            <p id="reviewLinkError" class="text-danger"></p>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Logo</label>
          <div class="col-sm-8">
            <div id="logoPreview">
              <img th:if="${clientDao.existingLogo}" th:src="@{|/uploads/${clientDao.existingLogo}|}" alt="Current Logo" width="100">
            </div>
            <input type="file" class="form-control" id="logoInput" th:field="*{logo}" accept="image/jpeg, image/png"/>
            <input type="hidden" th:field="*{existingLogo}"/>
            <p id="logoError" class="text-danger"></p>
          </div>
        </div>

        <input type="hidden" id="tagsInput" th:field="*{chatText}" />
        <div class="row mb-3">
          <label class="col-sm-4 col-form-label">Chat Text</label>
          <div class="col-sm-8">
            <div class="input-wrapper">
              <input type="text" id="chatTextInput" class="form-control" placeholder="Enter tag (use commas for multiple)" />
              <button type="button" class="plus-btn-inside" onclick="addTag()">+</button>
            </div>
            <div class="selected-tags mt-3">
              <h5>Selected Tags</h5>
            </div>
            <p id="chatTextError" class="text-danger"></p>
          </div>
        </div>

        <div class="row">
          <div class="offset-sm-4 col-sm-4 d-grid">
            <button type="button" class="btn btn-primary" onclick="submitForm()">Update</button>
          </div>
          <div class="col-sm-4 d-grid">
            <a href="/user/home" class="btn btn-secondary">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const tagSet = new Set();

  function validateForm() {
    let isValid = true;

    // Name validation
    const nameInput = document.querySelector('input[name="name"]');
    const nameError = document.getElementById('nameError');
    if (!nameInput.value.trim()) {
      nameError.textContent = "Name is required.";
      isValid = false;
    } else {
      nameError.textContent = "";
    }

    // Email validation
    const emailInput = document.querySelector('input[type="email"]');
    const emailError = document.getElementById('emailError');
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (emailInput.value.trim() && !emailRegex.test(emailInput.value.trim())) {
      emailError.textContent = "Invalid email address.";
      isValid = false;
    } else {
      emailError.textContent = "";
    }

    // Password validation - FIXED: Made truly optional for edit
    const passwordInput = document.querySelector('input[type="password"]');
    const passwordError = document.getElementById('passwordError');
    const passwordValue = passwordInput.value.trim();

    // Only validate if password is actually entered (not empty)
    if (passwordValue !== "" && passwordValue.length < 6) {
      passwordError.textContent = "Password must be at least 6 characters.";
      isValid = false;
    } else {
      passwordError.textContent = "";
    }

    // Mobile validation
    const mobileInput = document.getElementById('mobile');
    const mobileError = document.getElementById('mobileError');
    const mobileRegex = /^\d{10}$/;
    if (!mobileRegex.test(mobileInput.value.trim())) {
      mobileError.textContent = "Enter a valid 10-digit mobile number.";
      isValid = false;
    } else {
      mobileError.textContent = "";
    }

    // Review Link validation
    const reviewLink = document.getElementById("reviewLink").value;
    const reviewLinkError = document.getElementById("reviewLinkError");
    if (reviewLink.trim() === "") {
      reviewLinkError.textContent = "Review Link is required.";
      isValid = false;
    } else if (!isValidURL(reviewLink)) {
      reviewLinkError.textContent = "Invalid Review Link format.";
      isValid = false;
    } else {
      reviewLinkError.textContent = "";
    }

    // Logo validation - Made optional for edit (existing logo check)
    const logoInput = document.getElementById('logoInput');
    const logoError = document.getElementById('logoError');
    const existingLogo = document.querySelector("#logoPreview img");
    // Only require logo if no existing logo and no new file selected
    if (logoInput.files.length === 0 && !existingLogo) {
      logoError.textContent = "Please upload a logo.";
      isValid = false;
    } else {
      logoError.textContent = "";
    }

    // Tags validation
    if (tagSet.size < 10) {
      document.getElementById('chatTextError').textContent = "You must add at least 10 tags.";
      isValid = false;
    } else {
      document.getElementById('chatTextError').textContent = "";
    }

    return isValid;
  }

  function addTag() {
    const input = document.getElementById("chatTextInput");
    const tagsInput = document.getElementById("tagsInput");
    const chatTextError = document.getElementById("chatTextError");
    let inputValue = input.value.trim();

    if (inputValue) {
      let tags = inputValue.split(',')
        .map(tag => tag.trim())
        .filter(tag => tag !== '');

      let added = false;
      for (let tag of tags) {
        if (!tagSet.has(tag)) {
          tagSet.add(tag);
          added = true;
        } else {
          showError(`Tag "${tag}" already exists!`);
        }
      }

      if (added) {
        tagsInput.value = Array.from(tagSet).join(", ");
        updateDisplayedTags();
        chatTextError.textContent = "";
      }
      input.value = "";
    } else {
      showError("Please enter a tag.");
    }
  }

  function updateDisplayedTags() {
    const selectedTagsDiv = document.querySelector('.selected-tags');
    selectedTagsDiv.innerHTML = "<h5>Selected Tags</h5>";

    tagSet.forEach((tag, index) => {
      let tagSpan = document.createElement('span');
      tagSpan.classList.add('tag-modern');
      tagSpan.style.animationDelay = `${index * 0.05}s`;

      const tagText = document.createElement('span');
      tagText.className = 'mr-1.5';
      tagText.innerHTML = escapeHtml(tag);
      tagSpan.appendChild(tagText);

      const removeIcon = document.createElement('button');
      removeIcon.type = 'button';
      removeIcon.className = 'remove-tag-btn w-5 h-5 flex items-center justify-center rounded-full text-xs';
      removeIcon.innerHTML = '<i class="fas fa-times"></i>';
      removeIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        removeTag(tag);
      });

      tagSpan.appendChild(removeIcon);
      selectedTagsDiv.appendChild(tagSpan);
    });
  }

  function removeTag(tagToRemove) {
    tagSet.delete(tagToRemove);
    document.getElementById("tagsInput").value = Array.from(tagSet).join(", ");
    updateDisplayedTags();

    if (tagSet.size < 10) {
      document.getElementById('chatTextError').textContent = "You must add at least 10 tags.";
    } else {
      document.getElementById('chatTextError').textContent = "";
    }
  }

  function initializeTags(existingTags) {
    existingTags.split(',').forEach(tag => {
      let trimmedTag = tag.trim();
      if (trimmedTag) {
        tagSet.add(trimmedTag);
      }
    });
    updateDisplayedTags();
  }

  function isValidURL(string) {
    try {
      const url = new URL(string);
      return url.protocol === "http:" || url.protocol === "https:";
    } catch (_) {
      return false;
    }
  }

  function showError(message) {
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    errorText.textContent = message;
    errorMessage.classList.remove('hidden');
    setTimeout(() => errorMessage.classList.add('hidden'), 5000);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function submitForm() {
    if (validateForm()) {
      document.getElementById("editForm").submit();
    }
  }

  // Initialize tags on page load
  window.addEventListener('DOMContentLoaded', () => {
    const tagsInput = document.getElementById("tagsInput");
    if (tagsInput.value.trim()) {
      initializeTags(tagsInput.value);
    }
  });
</script>
</body>
</html>
