<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--th:replace="base::layout(~{::section})"-->
<head>
  <meta charset="UTF-8">
  <title>Register Page</title>
  <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<div class="bg-animation"></div>
<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="container">
  <div class="register-card">
    <div class="card-header">
      <h1>Create Account</h1>
      <p>Join us today</p>
    </div>

    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <form action="/createUser" method="post" onsubmit="return validateForm()">
      <div class="form-group">
        <div class="input-group">
          <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required>
          <i class="fas fa-user input-icon"></i>
        </div>
        <span id="usernameError" class="text-danger"></span>
      </div>

      <div class="form-group">
        <div class="input-group">
          <input type="password" name="password" id="password" class="form-control" placeholder="Create a password" required>
          <i class="fas fa-lock input-icon"></i>
        </div>
        <span id="passwordError" class="text-danger"></span>
      </div>

      <div class="form-group">
        <div class="input-group">
          <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
          <i class="fas fa-envelope input-icon"></i>
        </div>
        <span id="emailError" class="text-danger"></span>
      </div>

      <div class="form-group">
        <div class="input-group">
          <input type="number" name="mobile" id="mobile" class="form-control" placeholder="Enter your phone number" required>
          <i class="fas fa-phone input-icon"></i>
        </div>
        <span id="mobileError" class="text-danger"></span>
      </div>

      <button type="submit" class="btn-register" id="registerBtn">
        <span>Create Account</span>
      </button>
    </form>

    <div class="signin-link">
      <p>Already have an account? <a href="/signin">Sign in now</a></p>
    </div>
  </div>
</div>

<script>
  function validateForm() {
      let isValid = true;

      const usernameInput = document.getElementById("username");
      const usernameError = document.getElementById("usernameError");
      const usernameRegex = /^[a-zA-Z0-9_]{3,20}$/;
      if (!usernameRegex.test(usernameInput.value)) {
          usernameError.textContent = "Username must be 3-20 characters with only letters, numbers, and underscores.";
          usernameInput.style.borderColor = "#f87171";
          isValid = false;
      } else {
          usernameError.textContent = "";
          usernameInput.style.borderColor = "rgba(255, 255, 255, 0.1)";
      }

      const passwordInput = document.getElementById("password");
      const passwordError = document.getElementById("passwordError");
      const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
      if (!passwordRegex.test(passwordInput.value)) {
          passwordError.textContent = "Password must be at least 8 characters with uppercase, lowercase, number, and special character.";
          passwordInput.style.borderColor = "#f87171";
          isValid = false;
      } else {
          passwordError.textContent = "";
          passwordInput.style.borderColor = "rgba(255, 255, 255, 0.1)";
      }

      const emailInput = document.getElementById("email");
      const emailError = document.getElementById("emailError");
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(emailInput.value)) {
          emailError.textContent = "Please enter a valid email address.";
          emailInput.style.borderColor = "#f87171";
          isValid = false;
      } else {
          emailError.textContent = "";
          emailInput.style.borderColor = "rgba(255, 255, 255, 0.1)";
      }

      const mobileInput = document.getElementById("mobile");
      const mobileError = document.getElementById("mobileError");
      const mobileRegex = /^\d{10}$/;
      if (!mobileRegex.test(mobileInput.value)) {
          mobileError.textContent = "Please enter a valid 10-digit phone number.";
          mobileInput.style.borderColor = "#f87171";
          isValid = false;
      } else {
          mobileError.textContent = "";
          mobileInput.style.borderColor = "rgba(255, 255, 255, 0.1)";
      }

      if (isValid) {
          const registerBtn = document.getElementById("registerBtn");
          registerBtn.classList.add("loading");
          registerBtn.querySelector("span").style.opacity = "0";
      }

      return isValid;
  }

  // Add smooth focus effects
  document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', function() {
          this.parentElement.style.transform = 'scale(1.02)';
      });

      input.addEventListener('blur', function() {
          this.parentElement.style.transform = 'scale(1)';
      });
  });

  // Add hover effect to card
  const registerCard = document.querySelector('.register-card');
  registerCard.addEventListener('mousemove', function(e) {
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateX = (y - centerY) / 20;
      const rotateY = (centerX - x) / 20;

      this.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1, 1, 1)`;
  });

  registerCard.addEventListener('mouseleave', function() {
      this.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
  });
</script>
</body>
</html>
