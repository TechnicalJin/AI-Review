<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>| Login Page |</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="bg-animation"></div>
<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="container">
  <div class="login-card">
    <div class="card-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your account</p>
    </div>

    <div th:if="${msg}" class="alert alert-danger" th:text="${msg}"></div>
    <div th:if="${param.logout}" class="alert alert-success">Logout Successfully</div>

    <form th:action="@{/signin}" method="post" onsubmit="return validateForm()">
      <div class="form-group">
        <div class="input-group">
          <input type="email" name="username" id="username" class="form-control" placeholder="Enter your email" required>
          <i class="fas fa-envelope input-icon"></i>
        </div>
        <div th:if="${param.error != null}" class="alert alert-danger">Invalid username or password</div>
        <span id="emailError" class="text-danger"></span>
      </div>

      <div class="form-group">
        <div class="input-group">
          <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
          <i class="fas fa-lock input-icon"></i>
        </div>
        <span id="passwordError" class="text-danger"></span>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span>Sign In</span>
      </button>
    </form>

    <div class="signup-link">
      <p>Don't have an account? <a th:href="@{/register}">Create one now</a></p>
    </div>
  </div>
</div>

<script>
  function validateForm() {
      let isValid = true;

      const emailInput = document.getElementById("username");
      const emailError = document.getElementById("emailError");
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailRegex.test(emailInput.value)) {
          emailError.textContent = "Please enter a valid email address.";
          emailInput.style.borderColor = "#f87171";
          isValid = false;
      } else {
          emailError.textContent = "";
          emailInput.style.borderColor = "rgba(255, 255, 255, 0.1)";
      }

      const passwordInput = document.getElementById("password");
      const passwordError = document.getElementById("passwordError");

      if (passwordInput.value.length === 0) {
          passwordError.textContent = "Password is required.";
          passwordInput.style.borderColor = "#f87171";
          isValid = false;
      } else {
          passwordError.textContent = "";
          passwordInput.style.borderColor = "rgba(255, 255, 255, 0.1)";
      }

      if (isValid) {
          const loginBtn = document.getElementById("loginBtn");
          loginBtn.classList.add("loading");
          loginBtn.querySelector("span").style.opacity = "0";
      }

      return isValid;
  }

  // Add smooth focus effects
  document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', function() {
          this.parentElement.style.transform = 'scale(1.02)';
      });

      input.addEventListener('blur', function() {
          this.parentElement.style.transform = 'scale(1)';
      });
  });

  // Add hover effect to card
  const loginCard = document.querySelector('.login-card');
  loginCard.addEventListener('mousemove', function(e) {
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateX = (y - centerY) / 20;
      const rotateY = (centerX - x) / 20;

      this.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1, 1, 1)`;
  });

  loginCard.addEventListener('mouseleave', function() {
      this.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
  });
</script>
</body>
</html>
