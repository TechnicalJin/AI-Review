# ===============================
# Server Configuration (Prod)
# ===============================
server.forward-headers-strategy=framework
server.use-forward-headers=true

# Force HTTPS redirects and ensure secure context
server.require-ssl=false
# Note: SSL termination is handled by proxy, but we need to ensure secure redirects

# Tomcat configuration for proxy handling
server.tomcat.redirect-context-root=false
server.tomcat.use-relative-redirects=true
server.tomcat.protocol-header=X-Forwarded-Proto
server.tomcat.protocol-header-https-value=https
server.tomcat.port-header=X-Forwarded-Port
server.tomcat.remote-ip-header=X-Forwarded-For

# Security headers for HTTPS
security.require-ssl=true
security.headers.frame=false
security.headers.content-type=true